SLIDES.push({"nav": "L3A — Drama Across Cultures", "eyebrow": "Week 3 · Lesson 3 · Learn", "eyebrowR": "Lesson 3 · Screen A", "title": "Drama Across Cultures", "screenlbl": "Student screen 1 of 2", "wideLeft": true, "left": [{"k": "img", "src": "images/lessons/lesson-03.jpg", "cap": "Drama Across Cultures", "hero": true, "fit": true}, {"k": "hook", "q": "Describe how drama communicates ideas and helps continue and revitalise culture."}], "right": [{"k": "wp", "list": [{"t": "culture", "d": "shared beliefs, stories and ways of life"}, {"t": "folktale", "d": "a story passed down through generations"}, {"t": "trickster", "d": "clever character who outwits a stronger foe"}, {"t": "revitalise", "d": "bring new life and energy to something"}]}, {"k": "brain", "q": ["What feelings did the performance communicate?", "Why might this story matter to its culture?", "Which story pattern could inspire your own piece?"]}, {"k": "html", "html": "<div class=\"card cream\"><span class=\"tag do\">SUCCESS CRITERIA</span><ul style=\"margin:8px 0 0 18px\"><li>I can describe one way a performance communicated meaning.</li><li>I can explain why storytelling matters to a culture.</li></ul></div>"}], "notes": "<h4>Learn — Lesson 3</h4><p><b>Appendix D</b>. Breakout debut — pre-assign rooms, pin questions, pop into a couple of rooms to settle the routine.</p><p><b>Strand:</b> Exploring & Responding · Drama Across Cultures · <b>Mode:</b> BREAKOUT DEBUT</p><h4>Teach (also on Screen B sequence)</h4><ul><li><b>10 min · Teach + view storytelling clip</b><br>Play the chosen storytelling/drama clip(s). Pause to ask: what is happening, and what ideas or feelings are being communicated?<br><i>Tip:</i> Share screen with audio. Pre-test the link; have a backup clip ready. Preview for cultural appropriateness.</li><li><b>8 min · Character & situation (App. D)</b><br>Use App. D patterns to choose a character + situation — from a culture, folktale, history, or an original idea. Invite stories from students’ own backgrounds.<br><i>Tip:</i> First breakouts this week — pin two questions in each room; clear time limit + 2-min warning.</li></ul><h4>Discussion starters</h4><ul><li><b>Q1:</b> What feelings did the performance communicate?<br><i>Answer / tip:</i> Ask for evidence from voice, movement or situation — not one vague word. Sample: fear then relief; pride; playfulness.</li><li><b>Q2:</b> Why might this story matter to its culture?<br><i>Answer / tip:</i> Passes on values, history, humour, warning or belonging. Stories keep culture alive and help communities share who they are.</li><li><b>Q3:</b> Which story pattern could inspire your own piece?<br><i>Answer / tip:</i> Point to App. D: race/contest, wise elder, stranger, trickster, loyal animal, sky &amp; earth. Pick one pattern + their own twist.</li></ul><h4>Word Work</h4><ul><li><b>culture</b> — shared beliefs, stories and ways of life</li><li><b>folktale</b> — a story passed down through generations</li><li><b>trickster</b> — clever character who outwits a stronger foe</li><li><b>revitalise</b> — bring new life and energy to something</li></ul><p><b>Resources:</b> 1–2 vetted culture clips · App. D Character Shortlist · breakout rooms (pairs)</p><p><b>On-screen appendices:</b> App D — Characters. Press <kbd>I</kbd> — then <b>← Back to lesson</b>.</p>", "appsNav": ["App D — Characters"], "assessTab": "guide"});
SLIDES.push({"nav": "L3B — Apply", "eyebrow": "Week 3 · Lesson 3 · Apply", "eyebrowR": "Lesson 3 · Screen B", "title": "Drama Across Cultures — Apply", "screenlbl": "Student screen 2 of 2", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"steps\"><span class=\"tag do\">DO THIS · LESSON SEQUENCE</span><div class=\"row\"><div class=\"num\">1</div><div><b>8 min · Warm-up · Story Circle</b><span>One-sentence prompt; volunteers add a sentence (aloud or chat) to build a class story. Read chat additions aloud.</span></div></div><div class=\"row\"><div class=\"num\">2</div><div><b>10 min · Teach / watch</b><span>Play storytelling clip; pause for meaning and feeling.</span></div></div><div class=\"row\"><div class=\"num\">3</div><div><b>12 min · First breakouts</b><span>Think-pair-share: what did it communicate, and why might the story matter to its culture? Pin both questions.</span></div></div><div class=\"row\"><div class=\"num\">4</div><div><b>8 min · Teach · App. D</b><span>Patterns for character + situation; invite own-culture inspiration.</span></div></div><div class=\"row\"><div class=\"num\">5</div><div><b>18 min · Narrow it down</b><span>Independently choose character + situation; note where inspiration came from. Follow up anyone still undecided.</span></div></div><div class=\"row\"><div class=\"num\">6</div><div><b>4 min · Wrap</b><span>Exit ticket. Character + situation idea due at the start of Lesson 4.</span></div></div></div>"}, {"k": "html", "html": "<div class=\"card dark\"><span class=\"tag try\">TEACHER MODEL · 30 SEC</span><p style=\"margin-top:10px;color:var(--ink);font-size:15px;line-height:1.45\">Model answering “what did this communicate?” aloud, citing voice/movement/situation — then show how App. D helps lock a character + situation.</p></div>"}], "right": [{"k": "html", "html": "<div class=\"card cream\"><span class=\"tag read\">WATCH · DRAMA IN ACTION</span><p style=\"margin-top:8px\">Storytelling traditions around the world · TED-Ed / ABC Education (teacher-selected 1–2 clips)</p><p style=\"margin-top:8px;font-size:13px;color:#4a5a54\">Teacher: preview the full clip before showing.</p></div>"}, {"k": "exit", "items": ["Exit · A. Opening of a folktale from your family or culture", "Exit · B. Wise elder passing on one important lesson", "Exit · C. Hero discovers something amazing"]}, {"k": "html", "html": "<div class=\"card dark\"><span class=\"tag wow\">30-SEC EXIT TICKET</span><p style=\"margin-top:8px;color:var(--ink);font-size:14px\">Record &amp; upload — pick one. Mode: <b>BREAKOUT DEBUT</b>.</p></div>"}], "notes": "<h4>Apply — Lesson 3</h4><p><b>Appendix D</b>. Breakout debut — pre-assign rooms, pin questions, pop into a couple of rooms to settle the routine.</p><p><b>Mode:</b> BREAKOUT DEBUT · <b>Model:</b> Model answering “what did this communicate?” aloud, citing voice/movement/situation — then show how App. D helps lock a character + situation.</p><h4>Teach reminders</h4><ul><li><b>10 min · Teach + view storytelling clip</b><br>Play the chosen storytelling/drama clip(s). Pause to ask: what is happening, and what ideas or feelings are being communicated?<br><i>Tip:</i> Share screen with audio. Pre-test the link; have a backup clip ready. Preview for cultural appropriateness.</li><li><b>8 min · Character & situation (App. D)</b><br>Use App. D patterns to choose a character + situation — from a culture, folktale, history, or an original idea. Invite stories from students’ own backgrounds.<br><i>Tip:</i> First breakouts this week — pin two questions in each room; clear time limit + 2-min warning.</li></ul><p><b>Exit ticket:</b> A. Opening of a folktale from your family or culture · B. Wise elder passing on one important lesson · C. Hero discovers something amazing</p><h4>Discussion starters</h4><ul><li><b>Q1:</b> What feelings did the performance communicate?<br><i>Answer / tip:</i> Ask for evidence from voice, movement or situation — not one vague word. Sample: fear then relief; pride; playfulness.</li><li><b>Q2:</b> Why might this story matter to its culture?<br><i>Answer / tip:</i> Passes on values, history, humour, warning or belonging. Stories keep culture alive and help communities share who they are.</li><li><b>Q3:</b> Which story pattern could inspire your own piece?<br><i>Answer / tip:</i> Point to App. D: race/contest, wise elder, stranger, trickster, loyal animal, sky &amp; earth. Pick one pattern + their own twist.</li></ul>", "appsNav": ["App D — Characters"]});
SLIDES.push({"nav": "L4A — Building Your Character", "eyebrow": "Week 4 · Lesson 4 · Learn", "eyebrowR": "Lesson 4 · Screen A", "title": "Building Your Character", "screenlbl": "Student screen 1 of 2", "wideLeft": true, "left": [{"k": "img", "src": "images/lessons/lesson-04.jpg", "cap": "Building Your Character", "hero": true, "fit": true}, {"k": "hook", "q": "Build a character through role, situation and voice."}], "right": [{"k": "wp", "list": [{"t": "hot-seat", "d": "answering questions in role as your character"}, {"t": "role", "d": "who you are pretending to be"}, {"t": "want", "d": "what your character desires most"}, {"t": "posture", "d": "how your body shows the character"}]}, {"k": "brain", "q": ["What does your character want most right now?", "How would they walk into a room?", "Which App. F question reveals the most?"]}, {"k": "html", "html": "<div class=\"card cream\"><span class=\"tag do\">SUCCESS CRITERIA</span><ul style=\"margin:8px 0 0 18px\"><li>I can describe my character’s role and situation.</li><li>I can find a voice and posture for my character.</li></ul></div>"}], "notes": "<h4>Learn — Lesson 4</h4><p><b>Appendix F</b> hot-seat then <b>App. E</b> template. Model in role before pairs swap.</p><p><b>Strand:</b> Creating & Making · Devising Role & Situation · <b>Mode:</b> BREAKOUT PAIRS</p><h4>Teach (also on Screen B sequence)</h4><ul><li><b>8 min · Hot-seating demo (App. F)</b><br>Recap role, situation, voice. Demonstrate hot-seating — answer in role for about a minute using an App. F prompt.<br><i>Tip:</i> Ask a volunteer to interview you in role so pairs see the format.</li><li><b>6 min · Into the planning template (App. E)</b><br>Show how to turn hot-seat answers into the Monologue Planning Template — character, situation and voice.<br><i>Tip:</i> Keep a copy of templates so work isn’t lost if a student drops out.</li></ul><h4>Discussion starters</h4><ul><li><b>Q1:</b> What does your character want most right now?<br><i>Answer / tip:</i> The want drives the minute — e.g. to confess, to win, to escape, to be believed. If the want is weak, tension collapses.</li><li><b>Q2:</b> How would they walk into a room?<br><i>Answer / tip:</i> Posture shows status/mood: chin high vs shoulders hunched; quick vs careful steps. Link the walk to a voice choice.</li><li><b>Q3:</b> Which App. F question reveals the most?<br><i>Answer / tip:</i> Often “What do you want?” or “What’s the problem right now?” — those unlock the dramatic situation.</li></ul><h4>Word Work</h4><ul><li><b>hot-seat</b> — answering questions in role as your character</li><li><b>role</b> — who you are pretending to be</li><li><b>want</b> — what your character desires most</li><li><b>posture</b> — how your body shows the character</li></ul><p><b>Resources:</b> Breakout pairs · App. E Planning Template · App. F Hot-Seat prompts</p><p><b>On-screen appendices:</b> App F — Hot-seat · App E — Planning template. Press <kbd>I</kbd> — then <b>← Back to lesson</b>.</p>", "appsNav": ["App F — Hot-seat", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L4B — Apply", "eyebrow": "Week 4 · Lesson 4 · Apply", "eyebrowR": "Lesson 4 · Screen B", "title": "Building Your Character — Apply", "screenlbl": "Student screen 2 of 2", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"steps\"><span class=\"tag do\">DO THIS · LESSON SEQUENCE</span><div class=\"row\"><div class=\"num\">1</div><div><b>8 min · Warm-up · Walk As</b><span>Move on camera as characters you call — queen, trickster, giant, animal. Discuss how movement shows role.</span></div></div><div class=\"row\"><div class=\"num\">2</div><div><b>8 min · Teach · Hot-seat demo</b><span>Answer in role ~1 min with App. F; volunteer interviews you.</span></div></div><div class=\"row\"><div class=\"num\">3</div><div><b>20 min · Breakout hot-seat</b><span>Pairs take turns hot-seating each other’s character with App. F prompts. Rotate rooms so both get a turn.</span></div></div><div class=\"row\"><div class=\"num\">4</div><div><b>6 min · Teach · Template</b><span>Transfer answers onto App. E — character, situation, voice.</span></div></div><div class=\"row\"><div class=\"num\">5</div><div><b>14 min · Lock it in</b><span>Independently finalise character, situation and voice on the planning template.</span></div></div><div class=\"row\"><div class=\"num\">6</div><div><b>4 min · Wrap</b><span>Share character in one sentence + exit ticket. Preview Lesson 5 — finding the key moment.</span></div></div></div>"}, {"k": "html", "html": "<div class=\"card dark\"><span class=\"tag try\">TEACHER MODEL · 30 SEC</span><p style=\"margin-top:10px;color:var(--ink);font-size:15px;line-height:1.45\">Volunteer asks you one question; answer in role for ~30 sec with committed voice and posture.</p></div>"}], "right": [{"k": "html", "html": "<div class=\"card cream\"><span class=\"tag read\">WATCH · DRAMA IN ACTION</span><p style=\"margin-top:8px\">Hot-seating: building a character · BBC Bitesize / Drama Resource (~3 min)</p><p style=\"margin-top:8px;font-size:13px;color:#4a5a54\">Teacher: preview the full clip before showing.</p></div>"}, {"k": "exit", "items": ["Exit · A. Return a faulty product — explain the problem in character", "Exit · B. Voicemail explaining why you’re late", "Exit · C. Talk-show intro — name, age, biggest want"]}, {"k": "html", "html": "<div class=\"card dark\"><span class=\"tag wow\">30-SEC EXIT TICKET</span><p style=\"margin-top:8px;color:var(--ink);font-size:14px\">Record &amp; upload — pick one. Mode: <b>BREAKOUT PAIRS</b>.</p></div>"}], "notes": "<h4>Apply — Lesson 4</h4><p><b>Appendix F</b> hot-seat then <b>App. E</b> template. Model in role before pairs swap.</p><p><b>Mode:</b> BREAKOUT PAIRS · <b>Model:</b> Volunteer asks you one question; answer in role for ~30 sec with committed voice and posture.</p><h4>Teach reminders</h4><ul><li><b>8 min · Hot-seating demo (App. F)</b><br>Recap role, situation, voice. Demonstrate hot-seating — answer in role for about a minute using an App. F prompt.<br><i>Tip:</i> Ask a volunteer to interview you in role so pairs see the format.</li><li><b>6 min · Into the planning template (App. E)</b><br>Show how to turn hot-seat answers into the Monologue Planning Template — character, situation and voice.<br><i>Tip:</i> Keep a copy of templates so work isn’t lost if a student drops out.</li></ul><p><b>Exit ticket:</b> A. Return a faulty product — explain the problem in character · B. Voicemail explaining why you’re late · C. Talk-show intro — name, age, biggest want</p><h4>Discussion starters</h4><ul><li><b>Q1:</b> What does your character want most right now?<br><i>Answer / tip:</i> The want drives the minute — e.g. to confess, to win, to escape, to be believed. If the want is weak, tension collapses.</li><li><b>Q2:</b> How would they walk into a room?<br><i>Answer / tip:</i> Posture shows status/mood: chin high vs shoulders hunched; quick vs careful steps. Link the walk to a voice choice.</li><li><b>Q3:</b> Which App. F question reveals the most?<br><i>Answer / tip:</i> Often “What do you want?” or “What’s the problem right now?” — those unlock the dramatic situation.</li></ul>", "appsNav": ["App F — Hot-seat", "App E — Planning template"]});
SLIDES.push({"nav": "L5A — Make us wait", "eyebrow": "Week 5 · Lesson 5 · EXPERIENCE · NOTICE · NAME", "eyebrowR": "Lesson 5 · Screen A", "title": "Make the audience wait", "screenlbl": "Student screen 1 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag read\">LEARN + RESPOND</span><h4>Tension is more than being scary</h4><p>Imagine you are home alone. The lights cut out. Something scrapes outside. Then: <b>three slow knocks</b>. What makes that tense?</p><p><b>Tension = uncertainty + waiting + important consequences.</b> An actor controls it by delaying what the audience wants to know.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Six tension tools</b>Pace · pause or silence · voice · body and eye focus · sound · delayed information</div><div class=\"scenario-tile\"><b>Teacher model</b>Say <i>‘There’s someone at the door’</i> once quickly and evenly, then again with stillness, a pause and a quiet final word. Name the exact difference.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">0–5 min</div><div><b>Hook</b><span>Build the home-alone scene one detail at a time. Students show a 1–5 tension score in chat or on fingers.</span></div></div><div class=\"run-row\"><div class=\"run-time\">5–9 min</div><div><b>Notice</b><span>Students identify the moment tension rose and the clue that caused it.</span></div></div><div class=\"run-row\"><div class=\"run-time\">9–13 min</div><div><b>Teach + model</b><span>Name the formula and six tools. Compare the flat and shaped versions of the same line.</span></div></div><div class=\"run-row\"><div class=\"run-time\">13–15 min</div><div><b>Respond</b><span>Everyone posts one precise choice-and-effect sentence.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 1 · Choice and effect</div><p>Complete: <b>The actor used ___, which made the audience ___ because ___.</b> Name one exact moment—not just ‘it was good’.</p></div>"}], "notes": "<h4>Lesson 5A · EXPERIENCE · NOTICE · NAME</h4><h4>Evidence sweep</h4><p>Scan for an acting choice <em>and</em> an audience effect. Prompt vague responses with: ‘What exactly changed?’ Cameras are optional throughout.</p><p><b>WALT:</b> Combine elements of drama to shape and sustain a one-minute piece.</p><p><b>Resources:</b> Breakout pairs · App. E (continued) · App. G Structure Prompt Card</p>", "appsNav": ["App G — One-minute piece", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L5B — Three tense frames", "eyebrow": "Week 5 · Lesson 5 · TRY · BREAKOUT · EXPLAIN", "eyebrowR": "Lesson 5 · Screen B", "title": "Three frames, rising tension", "screenlbl": "Student screen 2 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag do\">BREAKOUT 1</span><h4>Build a visual tension ladder</h4><p>In a small group, create three freeze frames: <b>1 Normal → 2 A clue → 3 Almost revealed</b>.</p><p>Choose one trigger: a bag moves · a note appears · a door opens · an object is missing. The audience should feel a clear rise without anyone explaining the story.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Roles</b>Actor · director/scribe · sound-maker · reporter. With two people, combine roles.</div><div class=\"scenario-tile\"><b>Camera-off access</b>Describe the actor’s pose, choose the sound, write the three stage directions or report the group’s choices.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">15–18 min</div><div><b>Enter + assign</b><span>Choose the trigger and roles. The reporter opens a shared note.</span></div></div><div class=\"run-row\"><div class=\"run-time\">18–24 min</div><div><b>Make</b><span>Create Normal, Clue and Almost Revealed. Hold each frame for three seconds.</span></div></div><div class=\"run-row\"><div class=\"run-time\">24–27 min</div><div><b>Add tension</b><span>Add one sound or deliberate silence and strengthen the change in focus/body.</span></div></div><div class=\"run-row\"><div class=\"run-time\">27–30 min</div><div><b>Explain</b><span>Reporter posts the group’s strongest change and its audience effect.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 2 · Group evidence</div><p>Between Frame 1 and Frame 3 we changed <b>___</b>. This increased tension because the audience <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 5B · TRY · BREAKOUT · EXPLAIN</h4><h4>Room sweep</h4><p>Visit briefly: ask ‘What changes across the three frames?’ Give one actionable note, then leave the group to revise.</p><p><b>WALT:</b> Combine elements of drama to shape and sustain a one-minute piece.</p><p><b>Resources:</b> Breakout pairs · App. E (continued) · App. G Structure Prompt Card</p>", "appsNav": ["App G — One-minute piece", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L5C — Shape the minute", "eyebrow": "Week 5 · Lesson 5 · MODEL · MAP · TEST", "eyebrowR": "Lesson 5 · Screen C", "title": "Structure the one-minute piece", "screenlbl": "Student screen 3 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag try\">PLAN + REHEARSE</span><h4>Four beats give the minute a shape</h4><p>Map your own monologue or soliloquy: <b>opening → build → turning point → final line</b>.</p><p>The turning point is the peak: a discovery, decision, confession or change. Aim to reach it around <b>40–50 seconds</b>, then let the ending land.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Contrast makes a peak visible</b>Before the peak: quick speech or restless movement. At the peak: stillness, silence or one controlled line.</div><div class=\"scenario-tile\"><b>Fast model</b>Compare a flat four-line version with one that delays the reveal. Students point to the opening, build, turn and final beat.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">30–34 min</div><div><b>Model</b><span>Teacher performs the flat and shaped versions; class identifies where tension peaks.</span></div></div><div class=\"run-row\"><div class=\"run-time\">34–39 min</div><div><b>Map</b><span>Write one short note or line for each of the four beats.</span></div></div><div class=\"run-row\"><div class=\"run-time\">39–43 min</div><div><b>Test</b><span>Stand or sit in role and rehearse only the build into the turning point twice.</span></div></div><div class=\"run-row\"><div class=\"run-time\">43–45 min</div><div><b>Commit</b><span>Post the four beats and the technique that marks the peak.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 3 · Structure map</div><p>Post: <b>Opening / Build / Turning point / Final line</b>. Add the tension tool you will use at the turning point.</p></div>"}], "notes": "<h4>Lesson 5C · MODEL · MAP · TEST</h4><h4>Keep it playable</h4><p>Accept dot points rather than polished writing. The purpose is dramatic structure students can immediately rehearse.</p><p><b>WALT:</b> Combine elements of drama to shape and sustain a one-minute piece.</p><p><b>Resources:</b> Breakout pairs · App. E (continued) · App. G Structure Prompt Card</p>", "appsNav": ["App G — One-minute piece", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L5D — Test the turn", "eyebrow": "Week 5 · Lesson 5 · PERFORM · FEEDBACK · REPLAY", "eyebrowR": "Lesson 5 · Screen D", "title": "Test the turning point", "screenlbl": "Student screen 4 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag wow\">BREAKOUT 2</span><h4>Perform, receive one note, replay</h4><p>Perform the <b>30–45 seconds around your turning point</b>. Your partner watches for the moment tension peaks.</p><p>Directors give one note using: <b>‘When you used ___, the audience ___. Try ___ so that ___.’</b> Then replay the changed moment.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Partner roles</b>Performer first · director first; swap after the replay.</div><div class=\"scenario-tile\"><b>Camera-off access</b>Read the script aloud, create sound, listen for vocal choices or direct the performance.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">45–48 min</div><div><b>Set roles</b><span>Choose performer/director and name the turning point.</span></div></div><div class=\"run-row\"><div class=\"run-time\">48–53 min</div><div><b>First take</b><span>Each performer tests the short section; director records one element-and-effect note.</span></div></div><div class=\"run-row\"><div class=\"run-time\">53–56 min</div><div><b>Revise</b><span>Choose one exact change—pause, pace, focus, voice, body or sound.</span></div></div><div class=\"run-row\"><div class=\"run-time\">56–58 min</div><div><b>Replay</b><span>Repeat the changed 10–20 seconds and compare the effect.</span></div></div><div class=\"run-row\"><div class=\"run-time\">58–60 min</div><div><b>Exit</b><span>Post the change and save the plan to the folio.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 4 · Exit evidence</div><p>I used <b>___</b> to make the audience <b>___</b>. After feedback, I changed <b>___</b>.</p></div><div class=\"response-call onenote\"><div class=\"response-label\">OneNote / folio · Drama L5</div><p>Save <b>Structure and tension plan</b>: character’s want · four beats · peak moment · three deliberate tension choices · feedback received · revision made.</p></div>"}], "notes": "<h4>Lesson 5D · PERFORM · FEEDBACK · REPLAY</h4><h4>Lesson close</h4><p>Use iBoard responses to identify students who can name element + effect and those who need a short structure conference in Lesson 6.</p><p><b>WALT:</b> Combine elements of drama to shape and sustain a one-minute piece.</p><p><b>Resources:</b> Breakout pairs · App. E (continued) · App. G Structure Prompt Card</p>", "appsNav": ["App G — One-minute piece", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L6A — Voice and subtext", "eyebrow": "Week 6 · Lesson 6 · HEAR · COMPARE · NAME", "eyebrowR": "Lesson 6 · Screen A", "title": "Voice makes subtext audible", "screenlbl": "Student screen 1 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag read\">LEARN + TRY</span><h4>The words stay; the meaning changes</h4><p>Say <i>‘We need to talk’</i> as if you are excited, frightened and furious. The words are identical, but the listener receives three different stories.</p><p><b>Subtext</b> is the meaning underneath the words. Actors reveal it through <b>tone, pace, volume and pause</b>.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Four controls</b>Tone = feeling colour · pace = speed · volume = loud/soft · pause = chosen silence</div><div class=\"scenario-tile\"><b>Teacher model</b>Perform three versions. Students give each a tension score from 1–5 and identify the vocal evidence.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">0–4 min</div><div><b>Voice swap</b><span>Whole class tries the same line three ways—aloud, on mute, or by annotating it.</span></div></div><div class=\"run-row\"><div class=\"run-time\">4–8 min</div><div><b>Compare</b><span>Hear teacher versions and collect tension scores.</span></div></div><div class=\"run-row\"><div class=\"run-time\">8–12 min</div><div><b>Teach</b><span>Name subtext and the four voice controls; link choices to character want.</span></div></div><div class=\"run-row\"><div class=\"run-time\">12–15 min</div><div><b>Respond</b><span>Identify one exact change and what it communicated.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 1 · Vocal evidence</div><p>The meaning changed when the actor changed <b>___</b> from <b>___</b> to <b>___</b>. It suggested the character was <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 6A · HEAR · COMPARE · NAME</h4><h4>Listen for evidence</h4><p>Students may perform muted and type their intended choices. The check is whether they can connect a vocal control to meaning.</p><p><b>WALT:</b> Use improvisation to devise the words and voice for our piece.</p><p><b>Resources:</b> Breakout pairs · App. H Devising Techniques · App. E Planning Template</p>", "appsNav": ["App H — Devising", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L6B — Talk it out", "eyebrow": "Week 6 · Lesson 6 · IMPROVISE · SELECT · JUSTIFY", "eyebrowR": "Lesson 6 · Screen B", "title": "Talk it out to find the words", "screenlbl": "Student screen 2 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag do\">BREAKOUT 1</span><h4>Do not write every word first</h4><p>Performer speaks in character while the prompter asks: <b>What do you want? What stops you? What can’t you say?</b></p><p>The scribe captures only the strongest three lines. Swap halfway. Rough, surprising language is useful; polished writing comes later.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Roles</b>Performer · prompter/scribe. The performer can speak, type or send short written answers.</div><div class=\"scenario-tile\"><b>Keep test</b>Does the line reveal the want, obstacle, relationship or turning point? If not, let it go.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">15–18 min</div><div><b>Set up</b><span>Choose roles and restate each character’s want and problem.</span></div></div><div class=\"run-row\"><div class=\"run-time\">18–23 min</div><div><b>Round 1</b><span>Prompt the first performer; capture three possible lines.</span></div></div><div class=\"run-row\"><div class=\"run-time\">23–27 min</div><div><b>Round 2</b><span>Swap and repeat for the second performer.</span></div></div><div class=\"run-row\"><div class=\"run-time\">27–30 min</div><div><b>Select</b><span>Each student chooses one line and explains why it belongs.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 2 · Keep one line</div><p>My strongest improvised line is <b>‘___’</b>. I kept it because it reveals <b>___</b> about the character or problem.</p></div>"}], "notes": "<h4>Lesson 6B · IMPROVISE · SELECT · JUSTIFY</h4><h4>Room prompt</h4><p>If a pair stalls, ask one question in role and leave them with a 60-second speaking challenge. Do not turn this into silent script-writing.</p><p><b>WALT:</b> Use improvisation to devise the words and voice for our piece.</p><p><b>Resources:</b> Breakout pairs · App. H Devising Techniques · App. E Planning Template</p>", "appsNav": ["App H — Devising", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L6C — Voice ladder", "eyebrow": "Week 6 · Lesson 6 · TEST · MAP · CHOOSE", "eyebrowR": "Lesson 6 · Screen C", "title": "Build a voice ladder", "screenlbl": "Student screen 3 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag try\">BREAKOUT 2</span><h4>Test the turning-point line three ways</h4><p>Perform your key line three times. Change one control each time: tone, pace, volume or pause.</p><p>Your partner maps the choices, then names which version best serves the character and why. Create contrast between the moment <b>before</b> and the peak.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Example ladder</b>Before: quick + breathless → pause → Peak: slow + quiet</div><div class=\"scenario-tile\"><b>Director language</b>‘Version 2 worked because the pause made us wait for the confession.’</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">30–33 min</div><div><b>Choose</b><span>Select the turning-point line and decide the intended audience feeling.</span></div></div><div class=\"run-row\"><div class=\"run-time\">33–39 min</div><div><b>Test</b><span>Performer A tries three versions; partner maps and recommends one.</span></div></div><div class=\"run-row\"><div class=\"run-time\">39–43 min</div><div><b>Swap</b><span>Performer B tests; partner maps and recommends.</span></div></div><div class=\"run-row\"><div class=\"run-time\">43–45 min</div><div><b>Lock</b><span>Record the before/peak voice map.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 3 · Before and peak</div><p>Before the turning point my voice is <b>___</b>. At the peak it becomes <b>___</b>. This makes the audience <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 6C · TEST · MAP · CHOOSE</h4><h4>Precision check</h4><p>Ask students to replace emotion-only answers with audible controls: how fast, how loud, what tone and exactly where the silence falls.</p><p><b>WALT:</b> Use improvisation to devise the words and voice for our piece.</p><p><b>Resources:</b> Breakout pairs · App. H Devising Techniques · App. E Planning Template</p>", "appsNav": ["App H — Devising", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L6D — Rough full run", "eyebrow": "Week 6 · Lesson 6 · ASSEMBLE · RUN · REVISE", "eyebrowR": "Lesson 6 · Screen D", "title": "Build the rough full run", "screenlbl": "Student screen 4 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag wow\">REHEARSE</span><h4>Turn discoveries into a playable piece</h4><p>Arrange kept lines into <b>opening → build → turning point → final line</b>. Add short voice annotations such as <i>[faster]</i>, <i>[pause]</i> or <i>[quiet]</i>.</p><p>Run the whole piece once—even if it is imperfect. Listen to what feels repeated, unclear or too long; then cut or rewrite one part.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Success today</b>A complete rough journey with intentional voice—not a polished memorised script.</div><div class=\"scenario-tile\"><b>If recording is unavailable</b>Perform live to yourself, time it and immediately jot what you noticed.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">45–49 min</div><div><b>Assemble</b><span>Place chosen lines into the four-beat structure.</span></div></div><div class=\"run-row\"><div class=\"run-time\">49–54 min</div><div><b>Run</b><span>Perform once from start to finish with voice choices.</span></div></div><div class=\"run-row\"><div class=\"run-time\">54–57 min</div><div><b>Listen + edit</b><span>Identify one unclear/repeated section and cut or rewrite it.</span></div></div><div class=\"run-row\"><div class=\"run-time\">57–60 min</div><div><b>Exit + save</b><span>Post the strongest line/voice choice and save the rough script.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 4 · Exit evidence</div><p>My strongest line is <b>‘___’</b>. I will use <b>___</b> so it makes the audience <b>___</b>. My next revision is <b>___</b>.</p></div><div class=\"response-call onenote\"><div class=\"response-label\">OneNote / folio · Drama L6</div><p>Save <b>Devised words and voice</b>: rough script · highlight lines kept from improvisation · voice annotations · one cut/rewrite · a two-sentence reflection.</p></div>"}], "notes": "<h4>Lesson 6D · ASSEMBLE · RUN · REVISE</h4><h4>End point</h4><p>The piece should hang together end to end. Use iBoard to separate students needing line/structure help from those ready for camera work.</p><p><b>WALT:</b> Use improvisation to devise the words and voice for our piece.</p><p><b>Resources:</b> Breakout pairs · App. H Devising Techniques · App. E Planning Template</p>", "appsNav": ["App H — Devising", "App E — Planning template"], "assessTab": "guide"});
SLIDES.push({"nav": "L7A — Camera changes acting", "eyebrow": "Week 7 · Lesson 7 · DIAGNOSE · MODEL · FIX", "eyebrowR": "Lesson 7 · Screen A", "title": "The camera changes performance", "screenlbl": "Student screen 1 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag read\">TECH + PERFORMANCE</span><h4>Spot what weakens the performance</h4><p>A strong performance can disappear if the actor is backlit, too far away, hard to hear, looking at their own preview or using gestures outside the frame.</p><p>Camera acting needs five checks: <b>frame · light · lens focus · microphone · gesture size</b>. Small, clear choices often read more strongly than stage-sized ones.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Teacher comparison</b>Show the same lines badly set up, then improved. Freeze after each change and ask what became clearer.</div><div class=\"scenario-tile\"><b>Privacy first</b>Use a plain wall or virtual background where allowed. No student must reveal a private room or turn on a camera.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">0–4 min</div><div><b>Fault finder</b><span>Students inspect a deliberately weak setup and list likely problems.</span></div></div><div class=\"run-row\"><div class=\"run-time\">4–9 min</div><div><b>Model</b><span>Correct frame, light, eye line, sound and gesture one at a time.</span></div></div><div class=\"run-row\"><div class=\"run-time\">9–13 min</div><div><b>Teach</b><span>Explain medium/close framing and why actors look near the lens.</span></div></div><div class=\"run-row\"><div class=\"run-time\">13–15 min</div><div><b>Respond</b><span>Post three precise fault-and-fix pairs.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 1 · Technical diagnosis</div><p>List <b>three faults and fixes</b>: ‘The ___ is ___, so I would ___.’ Include at least one performance fix and one setup fix.</p></div>"}], "notes": "<h4>Lesson 7A · DIAGNOSE · MODEL · FIX</h4><h4>Safeguard</h4><p>Never ask students to pan around their home. Camera-off students analyse the teacher model and can demonstrate framing with a drawn rectangle.</p><p><b>WALT:</b> Use performance skills suited to performing on camera.</p><p><b>Resources:</b> Breakout pairs · App. I Rehearsal Checklist</p>", "appsNav": ["App I — Rehearsal checklist"], "assessTab": "guide"});
SLIDES.push({"nav": "L7B — Framing lab", "eyebrow": "Week 7 · Lesson 7 · TEST · DIRECT · SELECT", "eyebrowR": "Lesson 7 · Screen B", "title": "Find the frame that serves the story", "screenlbl": "Student screen 2 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag do\">BREAKOUT 1</span><h4>Wide, medium or close?</h4><p>Test three imagined or actual frames: <b>wide</b> for whole-body action, <b>medium</b> for gesture and face, <b>close</b> for thought and expression.</p><p>Choose the frame that best communicates your monologue—not simply the one that looks coolest.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Roles</b>Performer · director · tech/reporter. Rotate or combine roles.</div><div class=\"scenario-tile\"><b>Camera-off access</b>Direct another performer, describe a safe setup, or draw and label the chosen shot.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">15–18 min</div><div><b>Assign</b><span>Choose roles and identify the most important moment in the piece.</span></div></div><div class=\"run-row\"><div class=\"run-time\">18–23 min</div><div><b>Test</b><span>Try or mime wide, medium and close framing for the same lines.</span></div></div><div class=\"run-row\"><div class=\"run-time\">23–27 min</div><div><b>Direct</b><span>Adjust headroom, eye line, light and mic distance.</span></div></div><div class=\"run-row\"><div class=\"run-time\">27–30 min</div><div><b>Select</b><span>Choose one frame and justify its dramatic effect.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 2 · Frame decision</div><p>I chose a <b>___ shot</b> because the audience needs to notice <b>___</b>. I adjusted <b>___</b> so that <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 7B · TEST · DIRECT · SELECT</h4><h4>Room sweep</h4><p>Check that choices are story-led. Ask: ‘What should the audience notice at this distance?’</p><p><b>WALT:</b> Use performance skills suited to performing on camera.</p><p><b>Resources:</b> Breakout pairs · App. I Rehearsal Checklist</p>", "appsNav": ["App I — Rehearsal checklist"], "assessTab": "guide"});
SLIDES.push({"nav": "L7C — Micro-performance", "eyebrow": "Week 7 · Lesson 7 · PERFORM · NOTE · REPLAY", "eyebrowR": "Lesson 7 · Screen C", "title": "Micro-performance lab", "screenlbl": "Student screen 3 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag try\">BREAKOUT 2</span><h4>Improve twenty seconds, not everything</h4><p>Perform the <b>20 seconds around the turning point</b>. Test four camera-sized skills: lens focus, clear projection, readable facial expression and one controlled gesture.</p><p>The director gives one concrete action. Replay the same section immediately so both people can compare.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Useful note</b>‘Keep your eyes near the lens during the pause so the audience stays with the decision.’</div><div class=\"scenario-tile\"><b>Camera-off access</b>Read aloud for vocal feedback, listen as director, or annotate a script with eye line and gesture cues.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">30–33 min</div><div><b>Choose</b><span>Mark the 20-second turning-point section.</span></div></div><div class=\"run-row\"><div class=\"run-time\">33–38 min</div><div><b>First tests</b><span>Each performer shares once; director notes one observable issue.</span></div></div><div class=\"run-row\"><div class=\"run-time\">38–42 min</div><div><b>Replay</b><span>Apply the note and repeat the same moment.</span></div></div><div class=\"run-row\"><div class=\"run-time\">42–45 min</div><div><b>Compare</b><span>Record what changed and the audience effect.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 3 · Before and after</div><p>First, <b>___</b> weakened the moment. I changed <b>___</b>. The replay was stronger because <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 7C · PERFORM · NOTE · REPLAY</h4><h4>Make feedback observable</h4><p>Accept ‘move the camera closer’ or ‘slow the key line’; reject personality judgements such as ‘be more confident’ unless converted to an action.</p><p><b>WALT:</b> Use performance skills suited to performing on camera.</p><p><b>Resources:</b> Breakout pairs · App. I Rehearsal Checklist</p>", "appsNav": ["App I — Rehearsal checklist"], "assessTab": "guide"});
SLIDES.push({"nav": "L7D — 30-second take", "eyebrow": "Week 7 · Lesson 7 · CHECK · TAKE · REVIEW", "eyebrowR": "Lesson 7 · Screen D", "title": "Make a 30-second camera take", "screenlbl": "Student screen 4 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag wow\">REHEARSE + REVIEW</span><h4>Set up, perform, watch back, revise</h4><p>Complete a safe technical check, then capture one uninterrupted 30-second take. Watch or listen to the whole clip before judging it.</p><p>Score <b>voice · face · frame · gesture</b> out of three: 1 not clear yet · 2 mostly clear · 3 deliberate and effective. Choose only one next action.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>No recording?</b>Perform live, ask a partner to score the four areas, or use an audio-only rehearsal.</div><div class=\"scenario-tile\"><b>Keep private</b>A labelled setup diagram is valid evidence; no screenshot needs to show personal surroundings.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">45–49 min</div><div><b>Check</b><span>Use App. I: safe background, frame, light, sound, lens focus.</span></div></div><div class=\"run-row\"><div class=\"run-time\">49–53 min</div><div><b>Take</b><span>Perform the strongest 30 seconds without stopping.</span></div></div><div class=\"run-row\"><div class=\"run-time\">53–57 min</div><div><b>Review</b><span>Watch/listen once and score the four performance areas.</span></div></div><div class=\"run-row\"><div class=\"run-time\">57–60 min</div><div><b>Revise + save</b><span>Name one action and save rehearsal evidence.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 4 · Exit evidence</div><p>My camera strength is <b>___</b>; evidence: <b>___</b>. My next action is <b>___</b>.</p></div><div class=\"response-call onenote\"><div class=\"response-label\">OneNote / folio · Drama L7</div><p>Save <b>Camera rehearsal evidence</b>: setup checklist · voice/face/frame/gesture scores · feedback · screenshot OR labelled setup diagram · next action.</p></div>"}], "notes": "<h4>Lesson 7D · CHECK · TAKE · REVIEW</h4><h4>Diagnostic close</h4><p>Sort responses into performance, setup and access needs so Lesson 8 feedback pairs can be purposeful.</p><p><b>WALT:</b> Use performance skills suited to performing on camera.</p><p><b>Resources:</b> Breakout pairs · App. I Rehearsal Checklist</p>", "appsNav": ["App I — Rehearsal checklist"], "assessTab": "guide"});
SLIDES.push({"nav": "L8A — Feedback that works", "eyebrow": "Week 8 · Lesson 8 · COMPARE · NAME · UPGRADE", "eyebrowR": "Lesson 8 · Screen A", "title": "Feedback must cause a change", "screenlbl": "Student screen 1 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag read\">LEARN + RESPOND</span><h4>Kind, specific and usable</h4><p>Compare: <i>‘Good job!’</i> with <i>‘The pause before the confession built tension; hold it two seconds longer.’</i> Only one gives the performer an action.</p><p>Use the feedback formula: <b>notice the element → explain its effect → suggest an exact action</b>.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Glow</b>Name an element that worked and the audience effect it created.</div><div class=\"scenario-tile\"><b>Grow</b>Suggest one small, observable action—not ‘be better’ or ‘have confidence’.</div><div class=\"scenario-tile\"><b>Vocabulary bank</b>Tension · focus · contrast · mood · voice · movement · space · symbol</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">0–4 min</div><div><b>Compare</b><span>Vote for the comment that would actually improve a performance and explain why.</span></div></div><div class=\"run-row\"><div class=\"run-time\">4–8 min</div><div><b>Teach</b><span>Model notice + effect + action using a short performed line.</span></div></div><div class=\"run-row\"><div class=\"run-time\">8–12 min</div><div><b>Upgrade</b><span>Turn two vague comments into director-quality notes.</span></div></div><div class=\"run-row\"><div class=\"run-time\">12–15 min</div><div><b>Respond</b><span>Post one upgraded feedback sentence.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 1 · Upgrade the note</div><p>Upgrade <i>‘Speak better’</i>: <b>I noticed ___, which made the audience ___. Try ___ so that ___.</b></p></div>"}], "notes": "<h4>Lesson 8A · COMPARE · NAME · UPGRADE</h4><h4>Evidence sweep</h4><p>Look for drama vocabulary plus a doable action. Read two anonymous responses aloud and improve them together.</p><p><b>WALT:</b> Refine our performance using peer feedback and explain how we used elements of drama.</p><p><b>Resources:</b> Breakout pairs · App. J Peer Feedback Sheet · App. A Elements reference</p>", "appsNav": ["App J — Peer feedback", "App A — Elements"], "assessTab": "guide"});
SLIDES.push({"nav": "L8B — Rehearsal round one", "eyebrow": "Week 8 · Lesson 8 · PERFORM · OBSERVE · FEEDBACK", "eyebrowR": "Lesson 8 · Screen B", "title": "Peer rehearsal: round one", "screenlbl": "Student screen 2 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag do\">BREAKOUT 1</span><h4>One performer, one director, then swap</h4><p>Share your one-minute piece—or your strongest 45 seconds if it is unfinished. The director uses Appendix J to capture <b>one glow and one grow</b>.</p><p>Feedback must refer to something that happened: the line, pause, focus, voice, expression, movement or framing.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Roles</b>Performer A / director B, then swap. Keep time firmly.</div><div class=\"scenario-tile\"><b>Camera-off access</b>Perform by audio, read the script, listen as director or give feedback from a written excerpt.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">15–17 min</div><div><b>Set up</b><span>Open App. J, choose order and tell the director what feedback is most needed.</span></div></div><div class=\"run-row\"><div class=\"run-time\">17–22 min</div><div><b>Round A</b><span>First performance and one-minute spoken feedback.</span></div></div><div class=\"run-row\"><div class=\"run-time\">22–27 min</div><div><b>Round B</b><span>Swap performance and feedback.</span></div></div><div class=\"run-row\"><div class=\"run-time\">27–30 min</div><div><b>Record</b><span>Each student writes the most useful note received or given.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 2 · Peer note</div><p>One specific note was: <b>___</b>. It is useful because the performer can <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 8B · PERFORM · OBSERVE · FEEDBACK</h4><h4>Teacher sweep</h4><p>Check that both students perform or contribute evidence. Prompt directors to name the audience effect, not simply the actor’s behaviour.</p><p><b>WALT:</b> Refine our performance using peer feedback and explain how we used elements of drama.</p><p><b>Resources:</b> Breakout pairs · App. J Peer Feedback Sheet · App. A Elements reference</p>", "appsNav": ["App J — Peer feedback", "App A — Elements"], "assessTab": "guide"});
SLIDES.push({"nav": "L8C — Act on feedback", "eyebrow": "Week 8 · Lesson 8 · SELECT · REVISE · REPLAY", "eyebrowR": "Lesson 8 · Screen C", "title": "Prove the feedback changed something", "screenlbl": "Student screen 3 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag try\">BREAKOUT 2</span><h4>Revise the highest-value moment</h4><p>Choose the one note most likely to improve meaning for the audience. Apply it to a <b>10–20 second moment</b>, then replay that exact section.</p><p>Compare before and after using element + effect language. A revision is successful only when it changes what the audience notices, understands or feels.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>High-value change</b>Strengthen a turning point, clarify the character’s want, or make the final line land.</div><div class=\"scenario-tile\"><b>Example</b>Before: rushed confession. Revision: pause and stillness. Effect: audience anticipates the truth.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">30–33 min</div><div><b>Select</b><span>Underline one peer note and state the intended effect.</span></div></div><div class=\"run-row\"><div class=\"run-time\">33–38 min</div><div><b>Revise</b><span>Rehearse the changed 10–20 seconds twice.</span></div></div><div class=\"run-row\"><div class=\"run-time\">38–42 min</div><div><b>Replay</b><span>Show the partner; partner compares before and after.</span></div></div><div class=\"run-row\"><div class=\"run-time\">42–45 min</div><div><b>Explain</b><span>Post the exact revision and changed effect.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 3 · Before and after</div><p>Before, I <b>___</b>. I revised <b>___</b>. This changed the audience effect from <b>___</b> to <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 8C · SELECT · REVISE · REPLAY</h4><h4>Keep the loop short</h4><p>Do not allow a full rewrite. Students need to experience feedback → action → visible improvement within this block.</p><p><b>WALT:</b> Refine our performance using peer feedback and explain how we used elements of drama.</p><p><b>Resources:</b> Breakout pairs · App. J Peer Feedback Sheet · App. A Elements reference</p>", "appsNav": ["App J — Peer feedback", "App A — Elements"], "assessTab": "guide"});
SLIDES.push({"nav": "L8D — Final rehearsal", "eyebrow": "Week 8 · Lesson 8 · FULL RUN · LOCK · REFLECT", "eyebrowR": "Lesson 8 · Screen D", "title": "Lock the two improvements", "screenlbl": "Student screen 4 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag wow\">REHEARSE + EVIDENCE</span><h4>One full run with deliberate choices</h4><p>Perform the whole piece once. Use Appendix I to check voice, character, structure, tension and camera choices.</p><p>Lock <b>two improvements</b> you will keep next lesson. Do not chase ten tiny fixes; choose the changes that most help the audience.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Self-check</b>Can I name where each improvement appears and what it does?</div><div class=\"scenario-tile\"><b>Ready for Week 9</b>Piece runs end to end; feedback is recorded; remaining priority is specific.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">45–48 min</div><div><b>Prepare</b><span>Mark two revised moments and choose a feedback focus.</span></div></div><div class=\"run-row\"><div class=\"run-time\">48–53 min</div><div><b>Full run</b><span>Perform without stopping; partner or self uses App. I.</span></div></div><div class=\"run-row\"><div class=\"run-time\">53–57 min</div><div><b>Lock</b><span>Record two improvements that will stay and one remaining priority.</span></div></div><div class=\"run-row\"><div class=\"run-time\">57–60 min</div><div><b>Exit + save</b><span>Post evidence and save the peer-feedback record.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 4 · Exit evidence</div><p>The feedback I acted on was <b>___</b>. It improved <b>___</b> by <b>___</b>. My remaining priority is <b>___</b>.</p></div><div class=\"response-call onenote\"><div class=\"response-label\">OneNote / folio · Drama L8</div><p>Save <b>Rehearsal and peer feedback</b>: peer comment · exact revision · element-and-effect explanation · before/after reflection · remaining priority.</p></div>"}], "notes": "<h4>Lesson 8D · FULL RUN · LOCK · REFLECT</h4><h4>End point</h4><p>Use the four iBoard posts plus App. J to identify who revised from evidence and who still needs teacher-directed feedback.</p><p><b>WALT:</b> Refine our performance using peer feedback and explain how we used elements of drama.</p><p><b>Resources:</b> Breakout pairs · App. J Peer Feedback Sheet · App. A Elements reference</p>", "appsNav": ["App J — Peer feedback", "App A — Elements"], "assessTab": "guide"});
SLIDES.push({"type": "divider", "nav": "Weeks 9–10", "eyebrow": "Phase · Independent", "title": "Film & reflect", "goals": ["Independent polish with a help room", "Film the one-minute piece", "Celebrate and reflect (App. L)"], "notes": "<p>Long independent DO blocks + help room.</p>"});
SLIDES.push({"nav": "L9A — Readiness audit", "eyebrow": "Week 9 · Lesson 9 · CHECK · RATE · REPAIR", "eyebrowR": "Lesson 9 · Screen A", "title": "Pass the five readiness gates", "screenlbl": "Student screen 1 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag read\">DIAGNOSE</span><h4>Independent does not mean invisible</h4><p>Rate each gate <b>green, amber or red</b>: 1 complete structure · 2 about one minute · 3 lines secure enough · 4 drama choices deliberate · 5 safe filming setup possible.</p><p>A red or amber rating is useful evidence when it names the exact repair. Choose the gate that most affects the whole performance.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Green</b>Ready and supported by evidence.</div><div class=\"scenario-tile\"><b>Amber</b>Mostly ready; one specific repair needed.</div><div class=\"scenario-tile\"><b>Red</b>Blocked or incomplete; ask for targeted help now.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">0–4 min</div><div><b>Retrieve</b><span>Open script, App. I and App. K; locate the latest feedback.</span></div></div><div class=\"run-row\"><div class=\"run-time\">4–9 min</div><div><b>Audit</b><span>Rate all five gates and write one piece of evidence for each.</span></div></div><div class=\"run-row\"><div class=\"run-time\">9–12 min</div><div><b>Prioritise</b><span>Choose the highest-impact amber/red gate and one repair action.</span></div></div><div class=\"run-row\"><div class=\"run-time\">12–15 min</div><div><b>Report</b><span>Post current status so teacher can form the help room.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 1 · Readiness status</div><p>My priority gate is <b>___</b> and it is <b>green/amber/red</b>. Evidence: <b>___</b>. I will repair it by <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 9A · CHECK · RATE · REPAIR</h4><h4>Build the help queue</h4><p>Sort iBoard responses into structure, performance and technology/access. Invite red students first; do not wait for them to self-nominate again.</p><p><b>WALT:</b> Finalise and polish our piece, ready for filming.</p><p><b>Resources:</b> App. I Rehearsal Checklist · App. K Filming & Submission Guide · help breakout</p>", "appsNav": ["App K — Filming", "App I — Rehearsal checklist"], "assessTab": "task"});
SLIDES.push({"nav": "L9B — Rehearsal sprint", "eyebrow": "Week 9 · Lesson 9 · TARGET · REPEAT · TIME", "eyebrowR": "Lesson 9 · Screen B", "title": "Targeted rehearsal sprint", "screenlbl": "Student screen 2 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag do\">INDEPENDENT</span><h4>Repeat the moments that matter</h4><p>Avoid ten unfocused full runs. Rehearse: <b>opening ×2 · turning point ×3 · final line ×2</b>, then perform one uninterrupted full run.</p><p>Time the full run. Around one minute is the goal, but meaning matters more than racing to fit.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Opening</b>Focus, character and a reason to keep watching.</div><div class=\"scenario-tile\"><b>Turning point</b>Clear peak with deliberate contrast or tension.</div><div class=\"scenario-tile\"><b>Final line</b>Land it; hold focus for a beat before relaxing.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">15–18 min</div><div><b>Target</b><span>Mark the opening, turning point and final line.</span></div></div><div class=\"run-row\"><div class=\"run-time\">18–24 min</div><div><b>Repeat</b><span>Run the three moments using the 2–3–2 pattern.</span></div></div><div class=\"run-row\"><div class=\"run-time\">24–28 min</div><div><b>Full run</b><span>Perform once without stopping and record the duration.</span></div></div><div class=\"run-row\"><div class=\"run-time\">28–30 min</div><div><b>Diagnose</b><span>Name the strongest and weakest moment.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 2 · Timed evidence</div><p>My full run was <b>___ seconds</b>. Strongest moment: <b>___</b> because <b>___</b>. Weakest moment: <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 9B · TARGET · REPEAT · TIME</h4><h4>Visible independence</h4><p>The timed response is a checkpoint, not a competition. Follow up implausible times or missing weakest moments with a quick conference.</p><p><b>WALT:</b> Finalise and polish our piece, ready for filming.</p><p><b>Resources:</b> App. I Rehearsal Checklist · App. K Filming & Submission Guide · help breakout</p>", "appsNav": ["App K — Filming", "App I — Rehearsal checklist"], "assessTab": "task"});
SLIDES.push({"nav": "L9C — Help room", "eyebrow": "Week 9 · Lesson 9 · CHOOSE LANE · GET HELP · RETEST", "eyebrowR": "Lesson 9 · Screen C", "title": "Solve one real problem", "screenlbl": "Student screen 3 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag try\">TARGETED HELP</span><h4>Choose the right support lane</h4><p>Choose one lane: <b>structure</b> (the story is unclear) · <b>voice/tension</b> (the peak is flat) · <b>camera/tech</b> (setup or submission problem).</p><p>Bring one question, test one piece of advice, then report the result. Students who are green can act as peer directors or continue targeted rehearsal.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Structure prompt</b>What changes between the opening and final line?</div><div class=\"scenario-tile\"><b>Performance prompt</b>Which exact control will make the peak different?</div><div class=\"scenario-tile\"><b>Tech prompt</b>What is the safest simple setup or approved fallback?</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">30–33 min</div><div><b>Choose lane</b><span>State one problem as a question and join the relevant help group.</span></div></div><div class=\"run-row\"><div class=\"run-time\">33–38 min</div><div><b>Conference</b><span>Teacher/peer gives one action; student records it.</span></div></div><div class=\"run-row\"><div class=\"run-time\">38–42 min</div><div><b>Retest</b><span>Try the affected moment or setup immediately.</span></div></div><div class=\"run-row\"><div class=\"run-time\">42–45 min</div><div><b>Report</b><span>Post problem, advice, action and result.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 3 · Help acted on</div><p>Problem: <b>___</b>. Advice: <b>___</b>. I tried <b>___</b>. The result was <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 9C · CHOOSE LANE · GET HELP · RETEST</h4><h4>Access</h4><p>Keep a written queue. For technology blockers, agree on an approved fallback rather than repeatedly troubleshooting the same device.</p><p><b>WALT:</b> Finalise and polish our piece, ready for filming.</p><p><b>Resources:</b> App. I Rehearsal Checklist · App. K Filming & Submission Guide · help breakout</p>", "appsNav": ["App K — Filming", "App I — Rehearsal checklist"], "assessTab": "task"});
SLIDES.push({"nav": "L9D — Finalise the plan", "eyebrow": "Week 9 · Lesson 9 · FULL RUN · PLAN · COMMIT", "eyebrowR": "Lesson 9 · Screen D", "title": "Make a finalisation contract", "screenlbl": "Student screen 4 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag wow\">READY FOR FILMING</span><h4>Finish with evidence and a concrete next step</h4><p>Complete one final uninterrupted rehearsal and recheck Appendices I and K. Then plan <b>where, when, device and submission method</b> without showing or describing private spaces publicly.</p><p>Choose the final two actions that must happen before filming. If blocked, name the person or approved school pathway that can help.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Safe planning</b>A simple labelled setup—light in front, device stable, quiet background—is enough.</div><div class=\"scenario-tile\"><b>Honest status</b>Green means evidence-backed readiness, not optimism.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">45–50 min</div><div><b>Final run</b><span>Perform without stopping and notice whether the earlier repair held.</span></div></div><div class=\"run-row\"><div class=\"run-time\">50–54 min</div><div><b>Audit</b><span>Recheck performance and filming readiness using I/K.</span></div></div><div class=\"run-row\"><div class=\"run-time\">54–57 min</div><div><b>Plan</b><span>Record setup, timing, device, submission and fallback.</span></div></div><div class=\"run-row\"><div class=\"run-time\">57–60 min</div><div><b>Commit + save</b><span>Post status and save the final readiness record.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 4 · Final status</div><p>I am <b>green/amber/red</b> for filming because <b>___</b>. My next exact action is <b>___</b>.</p></div><div class=\"response-call onenote\"><div class=\"response-label\">OneNote / folio · Drama L9</div><p>Save <b>Final readiness record</b>: script status · duration · deliberate elements · safe setup diagram/checklist · help used · final two actions and fallback.</p></div>"}], "notes": "<h4>Lesson 9D · FULL RUN · PLAN · COMMIT</h4><h4>After class</h4><p>Contact amber/red students using the normal school process. The lesson now leaves four checkpoints instead of a forty-minute invisible work block.</p><p><b>WALT:</b> Finalise and polish our piece, ready for filming.</p><p><b>Resources:</b> App. I Rehearsal Checklist · App. K Filming & Submission Guide · help breakout</p>", "appsNav": ["App K — Filming", "App I — Rehearsal checklist"], "assessTab": "task"});
SLIDES.push({"nav": "L10A — Prepare to perform", "eyebrow": "Week 10 · Lesson 10 · WARM · CHECK · READY", "eyebrowR": "Lesson 10 · Screen A", "title": "Prepare the performer and space", "screenlbl": "Student screen 1 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag read\">FINAL SETUP</span><h4>Calm body, clear voice, safe setup</h4><p>Warm up without exhausting the performance: release shoulders and jaw, breathe low and steady, hum, then speak the opening and final line clearly.</p><p>Use Appendix K for a final <b>frame · light · sound · device · privacy</b> check. Fix only what will materially help the audience.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Nerves are usable</b>Slow the exhale, plant your feet and focus on the character’s want.</div><div class=\"scenario-tile\"><b>Privacy and access</b>No public tour of the filming space. Use the approved background, audio/fallback or school support arrangement.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">0–5 min</div><div><b>Warm up</b><span>Guided physical release, breathing, humming and articulation.</span></div></div><div class=\"run-row\"><div class=\"run-time\">5–9 min</div><div><b>Line check</b><span>Speak opening and final line with clear focus and breath.</span></div></div><div class=\"run-row\"><div class=\"run-time\">9–13 min</div><div><b>Setup check</b><span>Complete App. K and solve one setup issue.</span></div></div><div class=\"run-row\"><div class=\"run-time\">13–15 min</div><div><b>Report</b><span>Post readiness and the final fix.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 1 · Ready state</div><p>I am <b>green/amber/red</b>. My final setup or performance fix is <b>___</b>, because <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 10A · WARM · CHECK · READY</h4><h4>Teacher action</h4><p>Move red responses straight to the help pathway. Keep the emotional tone calm: this is a readiness check, not a public judgement.</p><p><b>WALT:</b> Perform our final piece with confidence and reflect on our drama journey.</p><p><b>Resources:</b> App. K · App. L Reflection Sheet · agreed submission method · help breakout</p>", "appsNav": ["App K — Filming", "App L — Reflection"], "assessTab": "task"});
SLIDES.push({"nav": "L10B — Dress rehearsal", "eyebrow": "Week 10 · Lesson 10 · DRESS RUN · REVIEW · ONE FIX", "eyebrowR": "Lesson 10 · Screen B", "title": "One uninterrupted dress rehearsal", "screenlbl": "Student screen 2 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag do\">REHEARSE</span><h4>Finish the take before judging it</h4><p>Perform the full piece without restarting for small mistakes. Watch or listen back once from beginning to end.</p><p>Choose <b>one high-value revision</b>: the change that most improves clarity, character or audience effect. Endless restarting usually makes the work less focused, not more.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Review questions</b>Was the character sustained? Did the turning point peak? Did the final line land?</div><div class=\"scenario-tile\"><b>One-fix rule</b>Make one precise adjustment, rehearse that moment once, then move on.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">15–18 min</div><div><b>Prepare</b><span>Silence notifications, open the checklist and settle into character.</span></div></div><div class=\"run-row\"><div class=\"run-time\">18–23 min</div><div><b>Dress take</b><span>Perform one complete uninterrupted run.</span></div></div><div class=\"run-row\"><div class=\"run-time\">23–27 min</div><div><b>Review</b><span>Watch/listen once; record duration and strongest element.</span></div></div><div class=\"run-row\"><div class=\"run-time\">27–30 min</div><div><b>One fix</b><span>Rehearse the highest-value adjustment once and report it.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 2 · Dress-run evidence</div><p>Duration: <b>___ seconds</b>. Strongest element: <b>___</b>, shown when <b>___</b>. My one fix is <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 10B · DRESS RUN · REVIEW · ONE FIX</h4><h4>Protect filming time</h4><p>At 30 minutes, students move forward. Perfectionism is not evidence of readiness; a complete reviewed take is.</p><p><b>WALT:</b> Perform our final piece with confidence and reflect on our drama journey.</p><p><b>Resources:</b> App. K · App. L Reflection Sheet · agreed submission method · help breakout</p>", "appsNav": ["App K — Filming", "App L — Reflection"], "assessTab": "task"});
SLIDES.push({"nav": "L10C — Film and submit", "eyebrow": "Week 10 · Lesson 10 · FILM · VERIFY · SUBMIT", "eyebrowR": "Lesson 10 · Screen C", "title": "Capture and verify the final performance", "screenlbl": "Student screen 3 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag try\">FINAL TAKE</span><h4>A file is not finished until it is checked</h4><p>Film the one-minute monologue or soliloquy using the agreed method. A second take is optional only if time allows and you know the exact reason.</p><p>Watch the complete chosen file, use the required filename, then submit. If blocked, stop repeating the failed step and enter the help pathway with the exact error.</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Verify</b>Correct file · complete beginning/end · audible · visible if video required · opens successfully.</div><div class=\"scenario-tile\"><b>Submission status</b>Submitted · uploading · blocked. All three require honest evidence.</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">30–33 min</div><div><b>Ready</b><span>Confirm storage, filename, submission location and fallback.</span></div></div><div class=\"run-row\"><div class=\"run-time\">33–39 min</div><div><b>Final take</b><span>Film one complete performance; optional purposeful second take.</span></div></div><div class=\"run-row\"><div class=\"run-time\">39–42 min</div><div><b>Verify</b><span>Watch the chosen file from start to finish.</span></div></div><div class=\"run-row\"><div class=\"run-time\">42–45 min</div><div><b>Submit/report</b><span>Upload and post status or the exact blocker.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 3 · Submission tracker</div><p>Status: <b>submitted / uploading / blocked</b>. Evidence or exact blocker: <b>___</b>. Next action (if needed): <b>___</b>.</p></div>"}], "notes": "<h4>Lesson 10C · FILM · VERIFY · SUBMIT</h4><h4>Teacher dashboard</h4><p>Use this response as the live submission sweep. Follow school privacy and storage rules; never request public links or personal cloud access.</p><p><b>WALT:</b> Perform our final piece with confidence and reflect on our drama journey.</p><p><b>Resources:</b> App. K · App. L Reflection Sheet · agreed submission method · help breakout</p>", "appsNav": ["App K — Filming", "App L — Reflection"], "assessTab": "task"});
SLIDES.push({"nav": "L10D — Reflect and celebrate", "eyebrow": "Week 10 · Lesson 10 · CELEBRATE · ANALYSE · REFLECT", "eyebrowR": "Lesson 10 · Screen D", "title": "Name the growth, not just the grade", "screenlbl": "Student screen 4 of 4", "wideLeft": true, "left": [{"k": "html", "html": "<div class=\"card cream live-content\"><span class=\"tag wow\">REFLECTION</span><h4>What did your choices communicate?</h4><p>Return together. Share one word for how performing felt; viewing selected clips is optional and follows class consent and privacy expectations.</p><p>Complete Appendix L using <b>element + evidence + effect</b>. Compare your work with Lesson 5: what can you now shape deliberately that you could not shape then?</p><div class=\"scenario-grid\"><div class=\"scenario-tile\"><b>Evidence sentence</b>‘I used stillness before the final line, which focused the audience on the decision.’</div><div class=\"scenario-tile\"><b>Growth sentence</b>‘Since Lesson 5, I can build tension across four clear beats instead of relying on loudness.’</div></div></div>"}], "right": [{"k": "html", "html": "<div class=\"lesson-run\"><div class=\"run-row\"><div class=\"run-time\">45–48 min</div><div><b>Celebrate</b><span>One-word chat check-in; acknowledge persistence and problem-solving.</span></div></div><div class=\"run-row\"><div class=\"run-time\">48–53 min</div><div><b>Analyse</b><span>Identify three drama elements with exact performance evidence and audience effect.</span></div></div><div class=\"run-row\"><div class=\"run-time\">53–57 min</div><div><b>Trace growth</b><span>Compare the final work with the Lesson 5 structure/tension plan.</span></div></div><div class=\"run-row\"><div class=\"run-time\">57–60 min</div><div><b>Exit + save</b><span>Post the proud moment and next goal; save the final folio reflection.</span></div></div></div><div class=\"response-call iboard\"><div class=\"response-label\">iBoard check 4 · Final exit</div><p>I am proud of <b>___</b>. My use of <b>___</b> made the audience <b>___</b>. Next time I will <b>___</b>.</p></div><div class=\"response-call onenote\"><div class=\"response-label\">OneNote / folio · Drama L10</div><p>Save <b>Final reflection</b>: what the piece communicates · three elements with evidence/effect · growth since Lesson 5 · strongest moment · next performance goal.</p></div>"}], "notes": "<h4>Lesson 10D · CELEBRATE · ANALYSE · REFLECT</h4><h4>Close the evidence loop</h4><p>Follow up any blocked submission after class. Assessment evidence now includes the performance plus six lessons of choices, revisions and reflection.</p><p><b>WALT:</b> Perform our final piece with confidence and reflect on our drama journey.</p><p><b>Resources:</b> App. K · App. L Reflection Sheet · agreed submission method · help breakout</p>", "appsNav": ["App K — Filming", "App L — Reflection"], "assessTab": "task"});
